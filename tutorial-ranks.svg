<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Ranks das peças</title>
  <desc id="description">Sete G formam F, seis F formam E, cinco E formam D, quatro D formam C, três C formam B e dois B formam A.</desc>
  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#eee7dc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#252824" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#paper)"/>
  <text x="34" y="43" fill="#252824" font-family="Georgia,serif" font-size="30">RANKS DAS PEÇAS</text>
  <text x="36" y="69" fill="#73736c" font-family="system-ui,sans-serif" font-size="16">Combine peças iguais para subir de rank</text>
  <path d="M30 82h1140" stroke="#a7482d" stroke-width="2"/>
