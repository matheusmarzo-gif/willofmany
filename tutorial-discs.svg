<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Oito discos e requisitos de promoção</title>
  <desc id="description">O tabuleiro tem oito discos concêntricos. O número de regiões de cada disco é igual ao seu nível. Para promover do disco L8 ao L7 são necessários oito soldados L8; de L7 para L6, sete L7; a regra segue até dois L2 para um L1 no centro.</desc>
