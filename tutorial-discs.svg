    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fbf8f1"/>
      <stop offset="1" stop-color="#eee7dc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#252824" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="440" rx="18" fill="url(#paper)"/>
  <text x="32" y="43" fill="#252824" font-family="Georgia,serif" font-size="30">OITO DISCOS, DO ANEL AO CENTRO</text>
  <text x="34" y="69" fill="#73736c" font-family="system-ui,sans-serif" font-size="16">Cada disco tem tantas regiões quanto o seu nível</text>
