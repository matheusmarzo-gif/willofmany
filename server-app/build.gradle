plugins {
    id "java"
    id "org.springframework.boot" version "3.4.5"
    id "io.spring.dependency-management" version "1.1.7"
}

group = "com.willofmany"
version = "1.0.0"

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-websocket"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    runtimeOnly "com.h2database:h2"
    runtimeOnly "org.postgresql:postgresql"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
}

tasks.named("test") {
    useJUnitPlatform()
}

tasks.named("processResources") {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "game.css"
        include "game-client.js"
        include "game-rules.js"
        include "will-of-many-ai.js"
        include "*.png"
        include "*.svg"
        into "static"
    }
}

springBoot {
    buildInfo()
}

tasks.register("packageServer", Exec) {
    dependsOn tasks.named("bootJar")
    def bootJarTask = tasks.named("bootJar", org.springframework.boot.gradle.tasks.bundling.BootJar)
    def executableName = "WillOfManyServer"
    def destination = layout.projectDirectory.dir("dist").asFile
    def javaHome = System.getProperty("java.home")
    inputs.file(bootJarTask.flatMap { it.archiveFile })
    inputs.property("jpackageExecutable", new File(javaHome, "bin/jpackage.exe").absolutePath)
    doFirst {
        project.delete(new File(destination, executableName))
    }
    commandLine(
        new File(javaHome, "bin/jpackage.exe").absolutePath,
        "--type", "app-image",
        "--input", bootJarTask.get().archiveFile.get().asFile.parent,
        "--main-jar", bootJarTask.get().archiveFileName.get(),
        "--name", executableName,
        "--dest", destination.absolutePath,
        "--win-console"
    )
    outputs.dir(new File(destination, executableName))
}
