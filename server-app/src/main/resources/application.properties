server.port=${PORT:8080}
server.address=${BIND_ADDRESS:0.0.0.0}
server.compression.enabled=true
server.ssl.enabled=${TLS_ENABLED:false}
server.ssl.key-store=${TLS_KEY_STORE:}
server.ssl.key-store-password=${TLS_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${TLS_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${TLS_KEY_ALIAS:}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/will-of-many;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
willofmany.google.client-id=${GOOGLE_CLIENT_ID:}
